<!DOCTYPE html>
<html lang="kk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
</head>
<body>

    <h1>Admin Panel</h1>
    <h3>Пайдаланушыларды басқару</h3>

    <p th:if="${message}"
       th:text="${message}"
       style="color:green;">
    </p>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Қазіргі рөлі</th>
                <th>Жаңа рөл</th>
                <th>Әрекет</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.role}"></td>

                <td>
                    <form th:action="@{/admin/users/{id}/role(id=${user.id})}"
                          method="post">

                        <select name="role">
                            <option th:each="r : ${roles}"
                                    th:value="${r}"
                                    th:text="${r}"
                                    th:selected="${r == user.role}">
                            </option>
                        </select>

                        <button type="submit">Өзгерту</button>
                    </form>
                </td>

                <td>Рөлді басқару</td>
            </tr>
        </tbody>
    </table>

    <br>
    <a href="/home">Басты бетке қайту</a>

</body>
</html>
